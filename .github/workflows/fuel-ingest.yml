# Import des prix des carburants toutes les 30 minutes.
# Le plan Hobby de Vercel limite ses crons à un par jour (nuxt.config.ts, nitro.vercel) : ce workflow prend le relais.
# Secrets du dépôt à définir : SITE_URL (ex. https://titine.fr) et CRON_SECRET (même valeur que sur Vercel).
# En plan Pro, on peut supprimer ce fichier et passer le cron Vercel de nuxt.config.ts à "*/30 * * * *".
name: Import des prix carburant

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appeler la route d'import
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets SITE_URL et CRON_SECRET manquants : import ignoré"
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/fuel-ingest"
